name: Refresh market data

on:
  schedule:
    - cron: "30 7 * * *"   # daily, 07:30 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh market data
        env:
          NEWHEDGE_TOKEN: ${{ secrets.NEWHEDGE_TOKEN }}
        run: python refresh_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "Data unchanged - nothing to publish."
          else
            git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      # The IRS resets the 7520 rate monthly; the table in model.js is manual.
      # File an issue (once) whenever the current month is missing.
      - name: Check 7520 rate table freshness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          if ! grep -q "\"$month\"" model.js; then
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "7520 rate table in:title" --json number --jq '.[0].number')
            if [ -z "$existing" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "7520 rate table needs $month" \
                --body "model.js SEC7520_RATES has no entry for $month. Get the new rate from https://www.irs.gov/businesses/small-businesses-self-employed/section-7520-interest-rates and add it — and if the rate changed, update the number in the article headline and opening paragraph of index.html."
            fi
          fi

      # If the refresh fails, file (or bump) a GitHub issue so the failure is
      # loud. Without this, failure emails are easy to miss and GitHub disables
      # the cron entirely after 60 days without repo activity.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Data refresh failing in:title" --json number --jq '.[0].number')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Data refresh failing since $(date -u +%Y-%m-%d)" \
              --body "The nightly data refresh failed: $run_url

          The site keeps serving the last good snapshot, but if this keeps failing for 60 days GitHub will disable the schedule (re-enable it under the Actions tab). Common causes: NewHedge renamed a metric slug, the API token was revoked, or a sanity gate caught bad upstream data."
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $run_url"
          fi
