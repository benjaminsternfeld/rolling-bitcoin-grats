name: Refresh market data

on:
  schedule:
    - cron: "30 7 * * *"   # daily, 07:30 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh market data
        env:
          NEWHEDGE_TOKEN: ${{ secrets.NEWHEDGE_TOKEN }}
        run: python refresh_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "Data unchanged - nothing to publish."
          else
            git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
